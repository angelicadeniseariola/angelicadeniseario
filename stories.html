<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Stories | Angelica Denise Mico Ariola</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Poppins:wght@300;400;500&display=swap">
<style>
  :root{
    --dark-green:#1b3326;
    --mid-green:#2f4f3e;
    --deep:#142019;
    --light-green-bg:#eef2e6;
    --gold:#c9a23a;
    --gold-light:#d9c08a;
    --text-dark:#1e2a22;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; font-family:'Poppins',sans-serif; color:#f5f5f5;
    background:radial-gradient(ellipse at 50% 70%, var(--mid-green) 0%, var(--dark-green) 45%, var(--deep) 100%);
    min-height:100vh;
  }
  .stage{ position:relative; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; overflow:hidden; padding:5rem 1rem 3rem; }
  .back-link{ position:absolute; top:1.2rem; left:1.4rem; z-index:20; color:var(--gold-light); text-decoration:none; font-family:'Playfair Display',serif; font-size:1rem; }
  .back-link:hover{ color:#fff; text-shadow:0 0 10px var(--gold); }
  h1{ font-family:'Playfair Display',serif; font-size:clamp(1.6rem,4vw,2.4rem); text-align:center; margin:0 0 .3rem; color:#f5f5f5; text-shadow:0 0 18px rgba(201,162,58,.6); position:relative; z-index:5; }
  .sub{ text-align:center; color:var(--gold-light); margin:0 0 2.2rem; font-size:.9rem; position:relative; z-index:5; }

  .beam{
    position:absolute; left:50%; bottom:30%; width:min(620px,95vw); height:80vh; transform:translateX(-50%); transform-origin:bottom center;
    background:linear-gradient(to top, rgba(217,192,138,.85), rgba(201,162,58,.3) 40%, transparent);
    clip-path:polygon(38% 100%,62% 100%,100% 0,0 0); filter:blur(20px); pointer-events:none;
    opacity:0;
  }
  .stage.open .beam{ animation:beamIn 2s ease-out .9s both, pulse 4s ease-in-out 3s infinite alternate; }
  .aura{ position:fixed; inset:0; pointer-events:none; opacity:0; transition:opacity 2s ease 1s; background:radial-gradient(ellipse at 50% 75%, rgba(201,162,58,.3), transparent 60%); }
  .stage.open .aura{ opacity:1; }
  @keyframes beamIn{ from{ opacity:0; transform:translateX(-50%) scaleY(.1); } to{ opacity:1; transform:translateX(-50%) scaleY(1); } }
  @keyframes pulse{ from{ opacity:.7; } to{ opacity:1; } }

  .spark{ position:absolute; bottom:30%; border-radius:50%; background:var(--gold-light); box-shadow:0 0 10px 3px var(--gold); opacity:0; pointer-events:none; }
  .stage.open .spark{ animation:floatUp linear infinite; }
  @keyframes floatUp{ 0%{ opacity:0; transform:translateY(0) scale(.5); } 20%{ opacity:1; } 100%{ opacity:0; transform:translateY(-62vh) translateX(var(--dx)) scale(1.1); } }

  .book{
    --pg-bg:#f6f8ee; --pg-edge:#e3e9d3; --pg-text:#1e2a22; --pg-head:#1b3326; --pg-muted:#7a8a7e; --pg-line:#c9d3b4; --pg-sub:#2f4f3e;
    position:relative; z-index:6; width:min(900px,94vw); height:480px; display:grid; grid-template-columns:1fr 1fr;
    transform:perspective(1500px) rotateX(20deg) translateX(-25%); transform-style:preserve-3d; transition:transform 1.3s ease;
  }
  .book[data-theme="sepia"]{ --pg-bg:#f4e8d0; --pg-edge:#e4d3b0; --pg-text:#3b2f1f; --pg-head:#5a3d1a; --pg-muted:#8a7757; --pg-line:#d8c49a; --pg-sub:#6b4a22; }
  .book[data-theme="night"]{ --pg-bg:#1f2a24; --pg-edge:#16201b; --pg-text:#d9e0d3; --pg-head:#e6cf94; --pg-muted:#93a398; --pg-line:#35453c; --pg-sub:#c9d6c4; }

  .glow{ position:relative; z-index:6; animation:bookGlow 6s ease-in-out infinite alternate; }
  @keyframes bookGlow{
    from{ filter:drop-shadow(0 0 18px rgba(201,162,58,.5)); }
    to{ filter:drop-shadow(0 0 36px rgba(217,192,138,.9)); }
  }
  .book.open{ transform:perspective(1500px) rotateX(20deg); }
  .book::before{
    content:""; position:absolute; inset:-14px -16px -22px; z-index:-1; border-radius:18px;
    background:linear-gradient(180deg,var(--mid-green),var(--deep)); border:2px solid var(--gold);
    box-shadow:0 0 70px 10px rgba(201,162,58,.45);
    opacity:0; transition:opacity .6s ease 1s;
  }
  .book.open::before, .book.open .spine{ opacity:1; }
  .spine{ position:absolute; left:50%; top:0; bottom:0; width:6px; transform:translateX(-50%); z-index:4; background:linear-gradient(var(--gold-light),var(--gold)); box-shadow:0 0 26px 10px rgba(217,192,138,.6); pointer-events:none; opacity:0; transition:opacity .6s ease 1.1s; }
  .page{
    position:relative; padding:1.8rem 2rem; color:var(--pg-text); display:flex; flex-direction:column; min-height:0; overflow:hidden;
    background:linear-gradient(90deg,var(--pg-edge),var(--pg-bg) 14%,var(--pg-bg) 86%,var(--pg-edge));
    transition:background .3s ease, color .3s ease;
  }
  .page-left{ border-radius:14px 0 0 14px; transform-origin:right center; box-shadow:inset -34px 0 40px -22px rgba(27,51,38,.4); opacity:0; transition:opacity .5s ease 1.15s; }
  .book.open .page-left{ opacity:1; }
  .page-right{ border-radius:0 14px 14px 0; box-shadow:inset 34px 0 40px -22px rgba(27,51,38,.4); }
  .flipper{
    position:absolute; right:0; top:0; width:50%; height:100%; z-index:5; transform-origin:left center; opacity:0; pointer-events:none;
    background:linear-gradient(90deg,var(--pg-edge),var(--pg-bg) 30%); border-radius:0 14px 14px 0;
  }
  .flipper.go{ animation:flip .9s ease-in-out; }
  @keyframes flip{ 0%{ opacity:1; transform:rotateY(0); } 85%{ opacity:1; } 100%{ opacity:0; transform:rotateY(-180deg); } }

  .cover{ position:absolute; top:0; left:50%; width:50%; height:100%; z-index:8; transform-origin:left center; transform-style:preserve-3d; cursor:pointer;
    transition:transform 1.3s cubic-bezier(.4,.1,.2,1), opacity .4s ease 1.1s; }
  .book.open .cover{ transform:rotateY(-180deg); opacity:0; pointer-events:none; }
  .cover-front, .cover-back{ position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden; }
  .cover-front{
    border-radius:0 14px 14px 0; background:linear-gradient(135deg,var(--mid-green),var(--deep)); border:3px solid var(--gold-light); border-left:14px solid var(--gold);
    display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:1.5rem;
    animation:coverShine 3s ease-in-out infinite alternate;
  }
  .cover-front h2{ font-family:'Playfair Display',serif; font-size:1.9rem; color:#f5f5f5; margin:0 0 .3rem; text-shadow:0 0 14px rgba(201,162,58,.6); }
  .cover-front small{ color:var(--gold-light); font-style:italic; font-family:'Playfair Display',serif; }
  .cover-front .tap{ margin-top:1.4rem; font-size:.75rem; letter-spacing:.2em; text-transform:uppercase; color:#f5f5f5; animation:tap 1.6s ease-in-out infinite; }
  .cover-front svg{ color:var(--gold-light); margin-bottom:1rem; filter:drop-shadow(0 0 8px rgba(201,162,58,.8)); }
  .cover-back{ transform:rotateY(180deg); background:linear-gradient(90deg,#e3e9d3,#f6f8ee); border-radius:14px 0 0 14px; }
  @keyframes coverShine{ from{ box-shadow:inset 0 0 30px rgba(201,162,58,.1); } to{ box-shadow:inset 0 0 80px rgba(201,162,58,.4); } }
  @keyframes tap{ 50%{ opacity:.3; } }

  .turnL{ animation:turnL .6s ease; transform-origin:right center; }
  .turnR{ animation:turnR .6s ease; transform-origin:left center; }
  @keyframes turnL{ from{ opacity:0; transform:perspective(900px) rotateY(60deg); } to{ opacity:1; transform:none; } }
  @keyframes turnR{ from{ opacity:0; transform:perspective(900px) rotateY(-60deg); } to{ opacity:1; transform:none; } }
  .arr{ font-family:Arial,sans-serif; line-height:1; }
  .list .arr{ color:var(--gold); }
  .page h2{ font-family:'Playfair Display',serif; font-size:1.3rem; color:var(--pg-head); border-bottom:2px solid var(--gold); padding-bottom:.4rem; margin:0 0 .8rem; }
  .list{ list-style:none; margin:0; padding:0; overflow-y:auto; }
  .list button{
    width:100%; text-align:left; background:none; border:none; border-bottom:1px dashed var(--pg-line); padding:.7rem .3rem;
    display:flex; justify-content:space-between; align-items:center; gap:.6rem; color:var(--pg-text); cursor:pointer; transition:all .2s ease; font-family:inherit;
  }
  .list button:hover, .list button.active{ background:rgba(201,162,58,.15); padding-left:.7rem; }
  .list b{ display:block; font-family:'Playfair Display',serif; font-size:1rem; color:var(--pg-head); }
  .list small{ color:var(--pg-muted); font-style:italic; font-size:.78rem; }

  .reader{ display:flex; flex-direction:column; min-height:0; flex:1; }
  .reader h3{ font-family:'Playfair Display',serif; font-size:1.35rem; color:var(--pg-head); margin:0; }
  .reader small{ color:var(--pg-muted); font-style:italic; }
  .reader .text{ flex:1; min-height:0; overflow:hidden; margin-top:.8rem; padding-right:.4rem; font-size:var(--fs,15px); line-height:1.75; }
  .reader .text p{ margin:0 0 .8rem; }
  .intro{ margin:auto; text-align:center; font-family:'Playfair Display',serif; font-style:italic; color:var(--pg-sub); }
  .intro .star{ font-size:2.2rem; color:var(--gold); display:block; margin-bottom:.6rem; font-style:normal; }
  .back-btn{ display:inline-flex; align-items:center; gap:.35rem; cursor:pointer; background:none; border:none; color:var(--pg-sub); font-size:.85rem; margin-bottom:.6rem; padding:0; text-align:left; height:1.4rem; }
  .back-btn:hover{ color:var(--gold); }

  .navrow{ display:flex; justify-content:space-between; align-items:center; height:1.4rem; margin-bottom:.6rem; font-size:.85rem; color:var(--pg-muted); }
  .navrow.bottom{ margin:.6rem 0 0; }
  .navrow button{ background:none; border:none; color:var(--pg-sub); font-size:.85rem; cursor:pointer; padding:0; font-family:inherit; }
  .navrow button:hover:not(:disabled){ color:var(--gold); }
  .navrow button:disabled{ opacity:.3; cursor:default; }

  .story-top{ display:flex; align-items:center; gap:.5rem; }
  .story-top .orn{ color:var(--gold); font-size:1.1rem; }
  .blurb{ font-size:.85rem; line-height:1.6; margin:.7rem 0 .9rem; color:var(--pg-text); }
  .pill-btn{
    display:inline-block; align-self:flex-start; background:var(--dark-green); color:#fff; border:1px solid var(--gold); border-radius:999px;
    padding:.5rem 1.3rem; font-family:inherit; font-size:.85rem; cursor:pointer; margin-bottom:.9rem; transition:all .2s ease;
  }
  .pill-btn:hover{ background:var(--gold); color:var(--deep); box-shadow:0 0 14px rgba(201,162,58,.6); }
  .resume-wrap{ margin-top:1rem; }
  .resume-wrap .pill-btn{ margin-bottom:0; }
  .chap-label{ font-family:'Playfair Display',serif; font-size:.8rem; letter-spacing:.12em; text-transform:uppercase; color:var(--pg-muted); border-top:1px solid var(--pg-line); padding-top:.6rem; margin-bottom:.1rem; }
  .reader .list{ flex:1; min-height:0; }

  /* Wattpad-style scrolling reader */
  body.noscroll{ overflow:hidden; }
  .wp{
    --w-bg:#f6f8ee; --w-bar:#eaf0de; --w-tx:#1e2a22; --w-mute:#7a8a7e; --w-line:#c9d3b4;
    position:fixed; inset:0; z-index:50; display:flex; flex-direction:column; background:var(--w-bg); color:var(--w-tx);
    opacity:0; visibility:hidden; pointer-events:none; transition:opacity .45s ease, visibility .45s;
  }
  .wp.show{ opacity:1; visibility:visible; pointer-events:auto; }
  .wp[data-theme="sepia"]{ --w-bg:#f4e8d0; --w-bar:#ead9b8; --w-tx:#3b2f1f; --w-mute:#8a7757; --w-line:#d8c49a; }
  .wp[data-theme="night"]{ --w-bg:#121a16; --w-bar:#1b2620; --w-tx:#d4dccf; --w-mute:#8c9d92; --w-line:#2d3c33; }
  .wp-bar{ position:relative; display:flex; align-items:center; gap:.8rem; padding:.7rem 1rem calc(.7rem + 3px); background:var(--w-bar); border-bottom:1px solid var(--w-line); }
  .wp-back{ background:none; border:none; color:var(--w-tx); font-family:'Playfair Display',serif; font-size:.95rem; cursor:pointer; padding:.2rem .3rem; white-space:nowrap; }
  .wp-back:hover{ color:var(--gold); }
  .wp-title{ flex:1; min-width:0; text-align:center; line-height:1.25; }
  .wp-title small{ display:block; color:var(--w-mute); font-size:.7rem; font-style:italic; }
  .wp-title b{ font-family:'Playfair Display',serif; font-size:.95rem; font-weight:600; }
  .wp-tools{ display:flex; align-items:center; gap:.45rem; margin-left:auto; }
  .wp-tools .tb{ background:none; border:1px solid var(--gold); color:var(--w-tx); border-radius:8px; padding:.2rem .6rem; font-family:'Playfair Display',serif; font-size:.9rem; cursor:pointer; }
  .wp-tools .tb:hover{ background:var(--gold); color:var(--deep); }
  .th{ width:22px; height:22px; border-radius:50%; border:2px solid var(--w-line); cursor:pointer; padding:0; }
  .th[data-t="paper"]{ background:#f6f8ee; }
  .th[data-t="sepia"]{ background:#f4e8d0; }
  .th[data-t="night"]{ background:#1f2a24; }
  .th.on{ border-color:var(--gold); box-shadow:0 0 8px 1px rgba(201,162,58,.7); }
  .wp-prog{ position:absolute; left:0; right:0; bottom:0; height:3px; background:rgba(0,0,0,.08); }
  .wp-prog i{ display:block; height:100%; width:0; background:linear-gradient(90deg,var(--gold),var(--gold-light)); transition:width .2s ease; }
  .wp-scroll{ flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  .wp-body{ max-width:680px; margin:0 auto; padding:2.4rem 1.4rem 5rem; font-family:'Poppins',sans-serif; font-weight:300; font-size:var(--fs,18px); line-height:1.95; }
  .wp-body p{ margin:0 0 1.15em; }
  .wp-ch{ font-family:'Playfair Display',serif; text-align:center; font-size:1.7em; margin:.4rem 0 .2rem; }
  .wp-orn{ text-align:center; color:var(--gold); font-size:1.2em; margin-bottom:1.8rem; }
  .wp-body p.end{ text-align:center; color:var(--w-mute); letter-spacing:.14em; font-size:.8em; margin-bottom:.4em; }
  .wp-body p:not(.end) + p.end{ margin-top:3rem; }
  .wp-nav{ display:flex; gap:.7rem; justify-content:center; flex-wrap:wrap; margin-top:2.4rem; }
  .wp-nav button{ background:var(--dark-green); color:#fff; border:1px solid var(--gold); border-radius:999px; padding:.55rem 1.2rem; font-family:inherit; font-size:.85rem; cursor:pointer; transition:all .2s ease; }
  .wp-nav button:hover:not(:disabled){ background:var(--gold); color:var(--deep); }
  .wp-nav button:disabled{ opacity:.35; cursor:default; }

  @media (max-width:720px){
    .book{ grid-template-columns:1fr; height:auto; min-height:460px; transform:perspective(1500px) rotateX(8deg); }
    .page-left, .page-right{ border-radius:14px; animation:none; box-shadow:none; min-height:460px; max-height:70vh; }
    .page-right{ display:none; }
    .book.reading .page-left{ display:none; }
    .book.reading .page-right{ display:flex; }
    .spine, .flipper{ display:none; }
    .book, .book.open{ transform:perspective(1500px) rotateX(8deg); }
    .cover{ left:0; width:100%; }
    .book.open .cover{ transform:rotateY(-110deg); }
    .cover-front{ border-radius:14px; }
    .back-btn{ display:inline-block; }
    .wp-title{ display:none; }
    .wp-body{ padding:1.6rem 1.1rem 4rem; }
  }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="aura"></div>
  <a class="back-link" href="index.html"><span class="arr">←</span> Back to Portfolio</a>
  <div class="beam"></div>

  <h1>My Stories</h1>
  <p class="sub">Tap the book to open it, then pick a story.</p>

  <div class="glow">
  <div class="book" id="book" data-theme="paper">
    <div class="spine"></div>
    <div class="flipper" id="flipper"></div>

    <div class="page page-left">
      <div id="left" style="display:flex;flex-direction:column;flex:1;min-height:0;"></div>
    </div>

    <div class="page page-right">
      <div id="reader" style="display:flex;flex-direction:column;flex:1;min-height:0;"></div>
    </div>

    <div class="cover" id="cover" role="button" tabindex="0" aria-label="Open the book">
      <div class="cover-front">
        <svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z"/><path d="M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"/></svg>
        <h2>My Stories</h2>
        <small>by Angelica Denise</small>
        <span class="tap">Tap to open</span>
      </div>
      <div class="cover-back"></div>
    </div>
  </div>
  </div>
</div>

<div class="wp" id="wp" data-theme="paper">
  <div class="wp-bar">
    <button class="wp-back" data-act="back"><span class="arr">←</span> Contents</button>
    <div class="wp-title" id="wpTitle"></div>
    <div class="wp-tools">
      <button class="tb" data-act="fsDown" aria-label="Smaller text">A−</button>
      <button class="tb" data-act="fsUp" aria-label="Larger text">A+</button>
      <button class="th" data-t="paper" aria-label="Paper theme" title="Paper"></button>
      <button class="th" data-t="sepia" aria-label="Sepia theme" title="Sepia"></button>
      <button class="th" data-t="night" aria-label="Night theme" title="Night"></button>
    </div>
    <div class="wp-prog"><i id="wpFill"></i></div>
  </div>
  <div class="wp-scroll" id="wpScroll"><article class="wp-body" id="wpBody"></article></div>
</div>

<script>
  const stories = [
    {
      title:"She’s Different", genre:"Drama · Friendship",
      blurb:"On her first day, a transfer student walks out of the “smartest” class and into the one everyone looks down on. They knew she would bring joy and heartbreak. They trusted her anyway.",
      chapters:[
        { name:"Prologue", text:[
          "The moment she walked through the door, we already knew.",
          "That she would bring both happiness and great devastation into our lives and hearts.",
          "We knew, yet we didn't stop her.",
          "We thought we already knew how hard it is to trust someone, only to be betrayed by them in the end.",
          "We thought we already knew how much pain it would cost to trust someone, yet we trusted her anyway.",
          "But those memories of trusting her... we would say they were the best memories we ever had."
        ]},
        { name:"Chapter 1", text:[
          "The hallway outside Grade 10, Class 1 was quiet in the way only a hallway during first period can be. Mr. Santiago stopped in front of the door and turned to the girl trailing a few steps behind him.",
          "“This is where you’ll be spending the school year,” he said. “Since you’re a transfer student, you don’t have to wear the uniform yet. Any questions?”",
          "She didn’t answer. Her eyes were on the nameplate above the door, and her face gave away even less.",
          "“Hmm.”",
          "That was all he got. Mr. Santiago let out a small breath and decided she was only nervous. Transfer students usually were.",
          "“Go on in and introduce yourself to the class, all right?”",
          "He opened the door for her.",
          "Every head in the room turned at once. The desks were lined up in perfect rows, every back was straight, and the whole class looked as though it had been rehearsing this moment all morning. Maybe it had.",
          "“Class, stand!” A boy in the front row was the first on his feet. His class president’s pin sat where everyone could see it, and his voice carried the polished confidence of someone used to being listened to. “Good morning, Mr. Santiago!”",
          "“Good morning, Mr. Santiago!” the rest echoed.",
          "“And good morning to you, new student.” The president turned to her with a practiced smile. “Welcome to Leticia University. This is Grade 10, Class 1, and we’re glad to have you. Thank you for choosing our school. We hope you’ll have a happy and peaceful year.”",
          "Applause rippled through the room, neat and perfectly timed.",
          "It was a good welcome. Most transfer students would have smiled, maybe even blushed. She did neither.",
          "The clapping thinned out and died. Thirty pairs of eyes waited for her to say something.",
          "“Can I move to the last section?”",
          "She didn’t say it to the class. She said it to Mr. Santiago, looking straight at him, as if the speech she had just received was nothing more than background noise.",
          "Mr. Santiago blinked. “W-what? Did the welcome make you uncomfortable, or...?”",
          "“No. I just don’t want to be here.” Her voice was flat and steady. “So, can I move to the last section?”",
          "Before Mr. Santiago could find his words, the president stepped out from behind his desk. The smile was gone.",
          "“If we made you uncomfortable, you could have just said so. But making a scene on your first day, in front of Mr. Santiago, is disrespectful.” He gave a short, disbelieving laugh. “You’re listed in Class 1. Only the smartest students are placed here, and you want to be moved to the lowest section?”",
          "Her gaze slid toward him, and the room seemed to grow colder.",
          "“Watch your mouth. I don’t know you, and I don’t care who you are. I said the last section, because it comes last. Not the lowest.” She took a step forward. “Why do you talk about them as if they’re beneath you? They’re students here too. They pay the same tuition you do.”",
          "“Because they’re troublemakers!” His composure finally cracked. “They cause problems every single day, and nobody can do anything about it because they pay. So what exactly am I lying about?”",
          "“The word,” she said, very quietly, “is last. And that was my last warning, you idiot.”",
          "She turned and walked out. The door slammed behind her hard enough to make half the class flinch, and Mr. Santiago hurried after her.",
          "“Wait! Please, wait!” He caught up with her halfway down the corridor, a little out of breath. “I’m sorry about how my student spoke to you. But you can’t transfer to the last section. Those students only cause trouble, and they aren’t... well, they aren’t smart like you. You’re in Section 1 for a reason. Just come back to class, and I won’t mention any of this to the Principal.”",
          "She stopped walking. Not because he had asked her to, but because something inside her had finally given way. Of everything she had heard that morning, his words were the ones that stung most.",
          "“Mr. Santiago.” She didn’t turn around. “Are you finished?”",
          "“I— uhm—”",
          "He never got to finish. She had already crossed the corridor and pushed open the door of the last section.",
          "Mr. Perez stopped mid-sentence, a piece of chalk still in his hand. Heads lifted from desks. A few students sat up straighter, and one or two stared openly at the stranger in the doorway.",

        { name:"Prologue: The Prodigy Myth", text:[
          "People love prodigy stories.",

          "I was never that prodigy. When I first sat in front of an IDE, my fingers froze. When I started singing, my voice shook. When I opened an accounting ledger in elementary school, numbers looked like tangled knots.",

          "The cursor blinked on an empty line at 1:47 AM in Sto. Tomas.",
          "Twenty-three red underlines glared back at me—a cascade of syntax errors and unclosed tags that seemed to question my place in tech.",
          "A younger version of me might have closed the laptop and surrendered to the voice that whispered: 'Maybe this is for the naturally gifted.'",
          "But somewhere between primary school classroom collections and organizing PUP department events, I learned a simple truth: talent is just a head start. It doesn't walk the rest of the mile for you.",

  ];

  const KEY = "angelica_stories_v2";
  let store = {};
  try{ store = JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ store = {}; }
  store.pos = store.pos || {};
  store.done = store.done || {};
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(store)); }catch(e){} }

  const book = document.getElementById("book");
  const left = document.getElementById("left");
  const reader = document.getElementById("reader");
  const flipper = document.getElementById("flipper");
  const stage = document.getElementById("stage");
  const wp = document.getElementById("wp");
  const esc = t => t.replace(/&/g, "&amp;").replace(/</g, "&lt;");
  let cur = -1;

  function mode(m){
    book.classList.remove("reading", "chapter");
    if(m) book.classList.add(m);
  }

  function applySettings(){
    wp.style.setProperty("--fs", (store.fs || 18) + "px");
    wp.dataset.theme = store.theme || "paper";
    document.querySelectorAll(".th").forEach(b => b.classList.toggle("on", b.dataset.t === (store.theme || "paper")));
  }
  applySettings();

  for(let i = 0; i < 30; i++){
    const sp = document.createElement("span");
    const size = 3 + Math.random() * 5;
    sp.className = "spark";
    const col = ["#c9a23a","#d9c08a","#f3e3b5","#a9c9b0","#ffffff"][i % 5];
    sp.style.background = col; sp.style.boxShadow = "0 0 10px 3px " + col;
    sp.style.width = sp.style.height = size + "px";
    sp.style.left = (50 + (Math.random() - .5) * 46) + "%";
    sp.style.animationDuration = (4 + Math.random() * 4) + "s";
    sp.style.animationDelay = (Math.random() * 6) + "s";
    sp.style.setProperty("--dx", ((Math.random() - .5) * 120) + "px");
    stage.appendChild(sp);
  }

  function anim(el, cls){ el.classList.remove("turnL", "turnR"); void el.offsetWidth; el.classList.add(cls); }

  const minsRead = c => Math.max(1, Math.round(c.text.join(" ").split(/\s+/).length / 200));

  function showIntro(){
    reader.innerHTML = '<div class="intro"><span class="star">✦</span>Welcome, reader.<br>Choose a story from the left page<br>and I will read it to you.</div>';
  }

  function resumeInfo(){
    const r = store.recent;
    if(r == null || !stories[r] || !store.pos[r]) return null;
    const p = store.pos[r], ch = stories[r].chapters[p.c];
    return ch ? { s:r, label: stories[r].title + " · " + ch.name } : null;
  }

  function renderLeftList(){
    const ri = resumeInfo();
    left.innerHTML = '<h2>Table of Stories</h2><ul class="list">' + stories.map((s, i) =>
      `<li><button data-i="${i}" class="${i === cur ? "active" : ""}"><span><b>${esc(s.title)}</b><small>${esc(s.genre)}</small></span><span class="arr">→</span></button></li>`
    ).join("") + '</ul>' +
    (ri ? `<div class="resume-wrap"><button class="pill-btn" id="resumeBtn">Continue reading</button><div style="font-size:.78rem;color:var(--pg-muted);font-style:italic;margin-top:.4rem;">${esc(ri.label)}</div></div>` : "");
    anim(left, "turnL");
  }

  function renderStory(i){
    const s = stories[i], p = store.pos[i];
    const status = j => {
      const d = store.done[i + "-" + j] || 0;
      return d >= .98 ? " · ✓ Finished" : d > 0 ? " · " + Math.round(d * 100) + "%" : "";
    };
    reader.innerHTML = `<button class="back-btn" id="rBack"><span class="arr">←</span> Back</button>
      <div class="reader">
        <div class="story-top"><span class="orn">✦</span><h3>${esc(s.title)}</h3></div>
        <small>${esc(s.genre)}</small>
        <p class="blurb">${esc(s.blurb || "")}</p>
        <button class="pill-btn" id="startBtn">${p ? "Continue Reading · " + esc(s.chapters[p.c].name) : "Start Reading"}</button>
        <div class="chap-label">Chapters</div>
        <ul class="list">${s.chapters.map((c, j) =>
          `<li><button data-j="${j}" class="${p && p.c === j ? "active" : ""}"><span><b>${esc(c.name)}</b><small>~${minsRead(c)} min read${status(j)}</small></span><span class="arr">→</span></button></li>`).join("")}</ul>
      </div>`;
    anim(reader, "turnR");
  }

  const wpScroll = document.getElementById("wpScroll"), wpBody = document.getElementById("wpBody"), wpFill = document.getElementById("wpFill");
  let curCh = 0, pendingRatio = 0, saveT = null;
  const isEnd = t => /^(END OF CHAPTER|THANK YOU FOR READING)/i.test(t);
  const maxScroll = () => Math.max(0, wpScroll.scrollHeight - wpScroll.clientHeight);
  const readRatio = () => { const m = maxScroll(); return m > 0 ? wpScroll.scrollTop / m : 1; };
  const setRatio = r => { wpScroll.scrollTop = r * maxScroll(); };

  function saveNow(){
    clearTimeout(saveT);
    if(cur < 0 || !wp.classList.contains("show")) return;
    const r = readRatio();
    store.pos[cur] = { c:curCh, r };
    store.recent = cur;
    const k = cur + "-" + curCh;
    store.done[k] = Math.max(store.done[k] || 0, r);
    save();
  }
  function trackProgress(){
    wpFill.style.width = Math.round(readRatio() * 100) + "%";
    clearTimeout(saveT);
    saveT = setTimeout(saveNow, 250);
  }

  function renderChapter(){
    const s = stories[cur], c = s.chapters[curCh];
    const hasPrev = curCh > 0, hasNext = curCh < s.chapters.length - 1;
    document.getElementById("wpTitle").innerHTML = `<small>${esc(s.title)}</small><b>${esc(c.name)}</b>`;
    wpBody.innerHTML = `<h2 class="wp-ch">${esc(c.name)}</h2><div class="wp-orn">✦</div>` +
      c.text.map(t => `<p class="${isEnd(t) ? "end" : ""}">${esc(t)}</p>`).join("") +
      `<div class="wp-nav"><button data-act="prev" ${hasPrev ? "" : "disabled"}>‹ Previous</button><button data-act="back">Contents</button><button data-act="next" ${hasNext ? "" : "disabled"}>Next Chapter ›</button></div>`;
    wpScroll.scrollTop = 0;
    requestAnimationFrame(() => { setRatio(pendingRatio); pendingRatio = 0; trackProgress(); });
  }

  function openChapter(i, j, ratio){
    const first = !wp.classList.contains("show");
    cur = i; curCh = j; pendingRatio = ratio || 0;
    if(first){ flipper.classList.remove("go"); void flipper.offsetWidth; flipper.classList.add("go"); }
    setTimeout(() => {
      wp.classList.add("show");
      document.body.classList.add("noscroll");
      renderChapter();
    }, first ? 420 : 0);
  }

  function closeReader(){
    saveNow();
    wp.classList.remove("show");
    document.body.classList.remove("noscroll");
    backToChapters();
  }

  function resume(i){
    const p = store.pos[i];
    if(p && stories[i].chapters[p.c]) openChapter(i, p.c, p.r > .97 ? 0 : p.r);
    else openChapter(i, 0, 0);
  }

  function selectStory(i){
    cur = i;
    renderLeftList(); renderStory(i);
    mode("reading");
  }
  function backToChapters(){
    mode("reading");
    renderLeftList(); renderStory(cur);
  }
  function resetBook(){
    cur = -1; mode(null);
    renderLeftList(); showIntro();
  }

  left.addEventListener("click", e => {
    if(e.target.closest("#lBack")) return backToChapters();
    if(e.target.closest("#resumeBtn")){ const ri = resumeInfo(); if(ri) resume(ri.s); return; }
    const b = e.target.closest("button[data-i]"); if(b) selectStory(+b.dataset.i);
  });
  reader.addEventListener("click", e => {
    if(e.target.closest("#rBack")) return resetBook();
    if(e.target.closest("#startBtn")) return resume(cur);
    const b = e.target.closest("button[data-j]"); if(b) openChapter(cur, +b.dataset.j, 0);
  });

  wp.addEventListener("click", e => {
    const t = e.target.closest("[data-t]");
    if(t){ store.theme = t.dataset.t; applySettings(); save(); return; }
    const a = e.target.closest("[data-act]"); if(!a || a.disabled) return;
    const act = a.dataset.act, s = stories[cur];
    if(act === "back") closeReader();
    else if(act === "prev" && curCh > 0){ saveNow(); openChapter(cur, curCh - 1, 0); }
    else if(act === "next" && curCh < s.chapters.length - 1){ saveNow(); openChapter(cur, curCh + 1, 0); }
    else if(act === "fsUp" || act === "fsDown"){
      const r = readRatio();
      store.fs = Math.min(30, Math.max(14, (store.fs || 18) + (act === "fsUp" ? 2 : -2)));
      applySettings(); save();
      requestAnimationFrame(() => setRatio(r));
    }
  });
  wpScroll.addEventListener("scroll", trackProgress, { passive:true });
  document.addEventListener("keydown", e => { if(e.key === "Escape" && wp.classList.contains("show")) closeReader(); });

  renderLeftList(); showIntro();

  const cover = document.getElementById("cover");
  function openBook(){ book.classList.add("open"); stage.classList.add("open"); }
  cover.addEventListener("click", openBook);
  cover.addEventListener("keydown", e => { if(e.key === "Enter" || e.key === " "){ e.preventDefault(); openBook(); } });
</script>
</body>
</html>
